<body>
  <header>
    <div class="header-content">
      <div class="logo-text">
        woolyspace <span class="lamb-mark">羊</span>

      <nav>

        <div class="image-strip-item">

          <img src="assets/me3.png" alt="">

      <div class="decorative-sheep decorative-sheep-1">

      </div>
      <div class="decorative-sheep decorative-sheep-2">

      </div>

      <div class="sign-stamp-corner sign-stamp-bottom-right">
        <img src="assets/sign1.png" alt="Sign stamp">

      <div class="sign-stamp-medium">

      </div>

  <footer class="footer">
    <p>Michelle's woolyspace</p>
    <div class="footer-links">
      <a href="https://www.instagram.com/woolyspace" target="_blank">Instagram</a>
      <a href="mailto:Michellesemail1025@gmail.com">Email</a>
