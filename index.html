<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>woolyspace — a love letter</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    
    .envelope-landing {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      place-items: center;
      min-height: 100vh;
      width: 100vw;
      padding: 0;
      margin: 0;
      background: linear-gradient(180deg, #f0f8fb 0%, #e8f4f8 50%, #d1e8f0 100%);
      background-attachment: fixed;
    }
    
    .envelope-link {
      text-decoration: none;
      color: inherit;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto auto;
      place-items: center;
      gap: 30px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    
    .envelope-link:hover {
      transform: scale(1.05);
    }
    
    .envelope-image-large {
      max-width: 600px;
      width: 90%;
      filter: drop-shadow(0 12px 32px rgba(135, 206, 235, 0.2));
      transition: filter 0.3s ease;
    }
    
    .envelope-link:hover .envelope-image-large {
      filter: drop-shadow(0 16px 40px rgba(135, 206, 235, 0.3));
    }
    
    .envelope-image-large img {
      width: 100%;
      height: auto;
      display: block;
    }
    
    .envelope-subtitle {
      font-family: 'Special Elite', 'Courier New', monospace;
      font-size: 14px;
      color: #666;
      letter-spacing: 0.1em;
      margin-top: 0;
      font-style: italic;
    }
    
    @media (max-width: 768px) {
      .envelope-image-large {
        max-width: 80%;
      }
    }
  </style>
</head>
<body class="home-page">
  <main class="envelope-landing">
    <a href="about.html" class="envelope-link">
      <div class="envelope-image-large">
        <img src="assets/envolope.png" alt="Envelope">
      </div>
      <p class="envelope-subtitle">a love letter from wooly space</p>
    </a>
  </main>
</body>
</html>
