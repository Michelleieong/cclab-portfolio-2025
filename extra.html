<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extra — woolyspace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo-text">
        woolyspace <span class="lamb-mark">羊</span>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="extra.html">Extra</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <!-- Visual Background Introduction -->
    <section class="visual-intro">
      <img src="assets/visual1.png" alt="Visual introduction">
    </section>

    <div class="archive-container">
      <!-- Decorative sheep elements -->
      <div class="decorative-sheep decorative-sheep-1">
        <img src="assets/sheep1.png" alt="">
      </div>
      <div class="decorative-sheep decorative-sheep-2">
        <img src="assets/sheep2.png" alt="">
      </div>

      <div class="archive-title">
        <h1>Visual Archive</h1>
        <p class="hero-subtitle" style="margin-top: 12px; font-family: 'Special Elite', monospace; font-size: 13px;">other works & moments</p>
      </div>

      <div class="archive-grid">
        <div class="archive-item">
          <img src="assets/work1.png" alt="Work 1">
        </div>
        <div class="archive-item">
          <img src="assets/work2.png" alt="Work 2">
        </div>
        <div class="archive-item">
          <img src="assets/work3.png" alt="Work 3">
        </div>
      </div>

      <!-- Sign5 - larger decoration -->
      <div class="sign-stamp-large" style="margin: 60px 0; text-align: center;">
        <img src="assets/sign5.png" alt="Sign5 decoration">
      </div>
    </div>

    <!-- Zine Scroll Section -->
    <section class="zine-scroll-section">
      <div class="zine-scroll-container">
        <div class="zine-scroll-content">
          <img src="zine1.png" alt="Zine page 1" class="zine-page">
          <img src="zine2.png" alt="Zine page 2" class="zine-page">
          <img src="zine3.png" alt="Zine page 3" class="zine-page">
          <img src="zine4.png" alt="Zine page 4" class="zine-page">
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Michelle's woolyspace</p>
  </footer>
</body>
</html>
