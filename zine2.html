<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zine 作品2 — woolyspace</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .zine-gallery-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 50px;
      margin: 60px auto;
      padding: 40px 20px;
      width: 100%;
      max-width: 1000px;
    }

    .zine-gallery-container img {
      width: 100%;
      max-width: 900px;
      height: auto;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      background-color: #fff;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo-text">
        woolyspace <span class="lamb-mark">羊</span>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="extra.html">Extra</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-wrap">
      <div class="project-hero">
        <h1>Zine 作品2</h1>
        <p class="subtitle">Visual pages</p>
      </div>
      
      <div class="zine-gallery-container">
        <iframe src="assets/Me_zineRevise.pdf" width="100%" height="1200px" style="border: none; border-radius: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); min-height: 1200px;"></iframe>
      </div>
      
      <div class="project-description" style="margin-top: 60px;">
        <p><a href="extra.html">← Back to Extra</a></p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Michelle's woolyspace</p>
  </footer>

  <script>
    // Debug: Check if images are loading
    document.addEventListener('DOMContentLoaded', function() {
      const images = document.querySelectorAll('.zine-gallery-container img');
      images.forEach((img, index) => {
        img.onload = function() {
          console.log('Image loaded:', img.src);
        };
        img.onerror = function() {
          console.error('Image failed to load:', img.src);
        };
      });
    });
  </script>
</body>
</html>
