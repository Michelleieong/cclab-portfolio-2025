<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zine — woolyspace</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .zine-viewer {
      max-width: 900px;
      margin: 60px auto;
    }
    
    .zine-cover-display {
      margin-bottom: 60px;
      text-align: center;
    }
    
    .zine-cover-display img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 20px var(--shadow);
    }
    
    .zine-pages-section {
      margin-top: 80px;
      text-align: center;
    }
    
    .zine-pages-title {
      font-family: 'Special Elite', monospace;
      font-size: 16px;
      color: var(--text-light);
      margin-bottom: 40px;
      letter-spacing: 0.1em;
    }
    
    .zine-viewer-container {
      position: relative;
      max-width: 100%;
      margin: 0 auto;
    }
    
    .zine-page-display {
      display: none;
      text-align: center;
    }
    
    .zine-page-display.active {
      display: block;
    }
    
    .zine-page-display img {
      max-width: 100%;
      height: auto;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 4px 20px var(--shadow);
      object-fit: contain;
    }
    
    .zine-navigation {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 40px;
      padding: 20px 0;
    }
    
    .zine-nav-btn {
      background-color: rgba(255, 255, 255, 0.8);
      border: 0.5px solid var(--border-color);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 20px;
      color: var(--text-color);
      text-decoration: none;
    }
    
    .zine-nav-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 12px var(--shadow);
      background-color: rgba(255, 255, 255, 0.95);
    }
    
    .zine-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    
    .zine-page-indicator {
      font-family: 'Special Elite', monospace;
      font-size: 14px;
      color: var(--text-light);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo-text">
        woolyspace <span class="lamb-mark">羊</span>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="extra.html">Extra</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-wrap">
      <div class="project-hero">
        <h1>Zine</h1>
        <p class="subtitle">Visual pages</p>
      </div>
      
      <div class="zine-viewer">
        <!-- Cover -->
        <div class="zine-cover-display">
          <img src="zinecover.png" alt="Zine Cover">
        </div>
        
        <!-- Pages -->
        <div class="zine-pages-section">
          <div class="zine-pages-title">Pages</div>
          
          <div class="zine-viewer-container">
            <div class="zine-page-display active" data-page="0">
              <img src="zine1.png" alt="Zine page 1">
            </div>
            <div class="zine-page-display" data-page="1">
              <img src="zine2.png" alt="Zine page 2">
            </div>
            <div class="zine-page-display" data-page="2">
              <img src="zine3.png" alt="Zine page 3">
            </div>
            <div class="zine-page-display" data-page="3">
              <img src="zine4.png" alt="Zine page 4">
            </div>
          </div>
          
          <div class="zine-navigation">
            <button class="zine-nav-btn" id="prevBtn" onclick="changePage(-1)">←</button>
            <span class="zine-page-indicator">
              <span id="currentPage">1</span> / <span id="totalPages">4</span>
            </span>
            <button class="zine-nav-btn" id="nextBtn" onclick="changePage(1)">→</button>
          </div>
        </div>
      </div>
      
      <div class="project-description" style="margin-top: 60px;">
        <p><a href="extra.html">← Back to Extra</a></p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Michelle's woolyspace</p>
  </footer>

  <script>
    let currentPageIndex = 0;
    const totalPages = 4;
    
    function showPage(index) {
      // Hide all pages
      const pages = document.querySelectorAll('.zine-page-display');
      pages.forEach(page => page.classList.remove('active'));
      
      // Show current page
      if (pages[index]) {
        pages[index].classList.add('active');
      }
      
      // Update indicator
      document.getElementById('currentPage').textContent = index + 1;
      
      // Update button states
      document.getElementById('prevBtn').disabled = index === 0;
      document.getElementById('nextBtn').disabled = index === totalPages - 1;
    }
    
    function changePage(direction) {
      const newIndex = currentPageIndex + direction;
      if (newIndex >= 0 && newIndex < totalPages) {
        currentPageIndex = newIndex;
        showPage(currentPageIndex);
      }
    }
    
    // Initialize
    showPage(0);
    
    // Keyboard navigation
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') {
        changePage(-1);
      } else if (e.key === 'ArrowRight') {
        changePage(1);
      }
    });
  </script>
</body>
</html>
